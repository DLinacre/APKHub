# The web address of your deployed APKHub site (or any PWA / website).
# Must include https://  e.g. https://yourname.github.io/apkhub
WEB_URL = https://lin4cre.github.io/AppHub/

# The display name shown under the app icon on the phone.
APP_NAME = APKHub

# The unique Android package identifier. Must be lowercase, use dots.
# Use something unique to you, e.g. com.yourname.apkhub
PACKAGE_ID = com.apkhub.app
