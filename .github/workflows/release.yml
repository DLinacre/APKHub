name: AppHub Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install indexer dependencies
        run: |
          pip install -r indexer/requirements.txt

      - name: Run Indexer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 indexer/index.py --config indexer/config.toml --out app/data

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Android APK
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apphub-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Install Node dependencies & Build Web App
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.1
          name: AppHub v1.0.1
          body: |
            ## ✨ AppHub Release v1.0.1
            
            This release includes:
            - 🛠️ Fixed Android build script (replaced invalid `inputReader` with `reader`).
            - 🌐 Updated production URL to `https://lin4cre.github.io/AppHub/`.
            - 📱 Automated build pipeline via GitHub Actions.
            - 📝 Complete README overhaul for a better user experience.
            
            Download the `app-debug.apk` below to install AppHub on your device!
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
